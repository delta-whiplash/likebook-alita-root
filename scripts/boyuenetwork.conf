#!/system/bin/sh
# ==============================================================================
# Boyue Native Init Hook (/data/boyue/boyuenetwork.conf)
# Launched automatically as root on boot via /system/bin/boyuenetwork.sh
# ==============================================================================

# 1. Ensure /sbin is accessible and su has SetUID root permissions (04755)
mount -o remount,rw / 2>/dev/null || true
chmod 0755 /sbin 2>/dev/null || true
if [ -f /data/local/tmp/su ]; then
    cp /data/local/tmp/su /sbin/su
    chown 0:0 /sbin/su
    chmod 04755 /sbin/su
fi

# 2. Local root shell listener on localhost port 9999 (daemonized)
pkill -f '9999' 2>/dev/null || true
toybox nc -s 127.0.0.1 -p 9999 -L /system/bin/sh -l </dev/null >/dev/null 2>&1 &

# 3. Trigger battery & CPU governor optimizations (daemonized)
if [ -f /data/boyue/boot_optimize.sh ]; then
    sh /data/boyue/boot_optimize.sh </dev/null >/dev/null 2>&1 &
fi
